# ─────────────────────────────────────────────────────────────────────────
# fibre-backend — CI + CD
#
# Runs on every push to main and every pull request.
#
# main is the single deploy point: code travels branch -> PR -> main, and the
# `deploy` job at the bottom of this file is what ships main onward. Point the
# host at `main`, never at a feature branch — a branch can be deleted or
# force-pushed, and a host tracking one would deploy code that never went
# through this gate.
#
# The suite runs against a REAL PostgreSQL + PostGIS service, not SQLite.
# That is deliberate: `ftth_lld/views.py` uses `.distinct("<field>")`, which is
# PostgreSQL's DISTINCT ON. On SQLite that raises
# `NotSupportedError: DISTINCT ON fields is not supported by this database
# backend`, so the SQLite test settings (config/test_settings.py) can never
# give a green run. CI mirrors production instead.
#
# The application also reads `gis.*` tables written by the FastAPI engine, so
# the gis/business schemas and the postgis extension are created before the
# suite runs.
# ─────────────────────────────────────────────────────────────────────────

name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Superseded runs on the same branch are pointless once a newer commit lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (PostgreSQL + PostGIS)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: ftth
          POSTGRES_USER: ftth
          POSTGRES_PASSWORD: ftth
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ftth"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      # FTTH_DB=local selects the local branch of config/settings.py, which
      # reads every connection detail from the environment. This keeps CI off
      # the production database entirely.
      FTTH_DB: local
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: ftth
      PGPASSWORD: ftth
      PGDATABASE: ftth
      DJANGO_DEBUG: "false"
      # Throwaway value: CI must never see the real one.
      DJANGO_SECRET_KEY: ci-only-not-a-real-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # GitHub's ubuntu-latest image ships the PostgreSQL client, but that is an
      # image detail, not a guarantee — and it is the kind of assumption that
      # only surfaces as a red pipeline later. Install it if it is missing.
      - name: Ensure the PostgreSQL client is available
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
          psql --version

      - name: Enable PostGIS and create the shared schemas
        env:
          PGPASSWORD: ftth
        run: |
          psql -h 127.0.0.1 -U ftth -d ftth -v ON_ERROR_STOP=1 \
            -c "CREATE EXTENSION IF NOT EXISTS postgis;" \
            -c "CREATE SCHEMA IF NOT EXISTS business;" \
            -c "CREATE SCHEMA IF NOT EXISTS gis;"

      - name: Django system checks
        run: python manage.py check

      - name: Apply migrations
        run: python manage.py migrate --noinput

      # ~8 minutes: one portal-sync test makes real network calls that must
      # time out. Kept because it exercises the live-portal code path.
      - name: Run test suite
        run: python manage.py test --verbosity 2

  image:
    name: Image builds and serves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the production image
        run: docker build --tag fibre-backend:ci .

      # Catches the class of failure a build alone cannot see: collectstatic
      # finding nothing, whitenoise misconfigured, gunicorn unable to boot.
      # /healthz and /static/ are deliberately DB-free, so no database is
      # needed here.
      - name: Smoke-test the running image
        run: |
          set -euo pipefail
          docker run --detach --name smoke --publish 8000:8000 \
            --env DJANGO_DEBUG=false \
            --env 'DJANGO_ALLOWED_HOSTS=*' \
            --env DJANGO_SECRET_KEY=ci-only-not-a-real-secret \
            fibre-backend:ci

          for _ in $(seq 1 30); do
            if curl --silent --fail --max-time 3 http://127.0.0.1:8000/healthz >/dev/null; then
              break
            fi
            sleep 1
          done

          echo "--- /healthz ---"
          curl --silent --fail --max-time 10 http://127.0.0.1:8000/healthz

          echo
          echo "--- static asset via whitenoise ---"
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --max-time 10 http://127.0.0.1:8000/static/admin/css/base.css)
          echo "HTTP $status"
          test "$status" = "200"

      - name: Container logs on failure
        if: failure()
        run: docker logs smoke || true

  # Advisory only — these two checks flag PRE-EXISTING drift in the repo, not
  # anything the CI change introduced. They are reported in the log so the
  # drift stays visible, but they must not block deploys until the team
  # decides how to resolve them. See docs/DEPLOY.md "Known drift".
  #   * check --deploy  : flags the DEBUG/SECRET_KEY defaults in settings.py
  #   * makemigrations  : permits/ has model index names with no migration
  advisory:
    name: Deploy checklist (advisory, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: ftth
          POSTGRES_USER: ftth
          POSTGRES_PASSWORD: ftth
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ftth"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      FTTH_DB: local
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: ftth
      PGPASSWORD: ftth
      PGDATABASE: ftth
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: ci-only-not-a-real-secret

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt

      - name: Django deployment checklist
        run: python manage.py check --deploy || true

      - name: Report models without a migration
        run: python manage.py makemigrations --check --dry-run || true

  # The monitor's alerting rules are shell, so they are tested with shell.
  # Cheap and dependency-free, and it protects the property that is easy to
  # lose silently: repeats stay quiet but a NEW failure still alerts.
  monitor-test:
    name: Monitor alert logic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test the alert dedupe
        run: bash tools/test_monitor_dedupe.sh

  # ── CD ───────────────────────────────────────────────────────────────────
  # main is the single deploy point, and this is the only thing that deploys.
  #
  # It is deliberately NOT the host's own "deploy on push" integration: that
  # would ship whatever lands on main regardless of whether the tests passed.
  # Gating on `needs` means a release can only follow a green main — the test
  # suite AND the image smoke-test — which is the whole point of routing the
  # code through main in the first place.
  #
  # Two repository secrets wire it up; neither is required to merge this:
  #
  #   DEPLOY_HOOK_URL    the host's deploy hook (Render/Zeabur deploy hook, a
  #                      Cloud Run trigger URL, or any endpoint that starts a
  #                      release). Until it is set this job reports what is
  #                      missing and exits successfully.
  #   DEPLOY_HEALTH_URL  optional. A URL that must answer 200 after the
  #                      release, e.g. https://<host>/healthz. If set, the
  #                      job fails when the service does not come back, so a
  #                      broken deploy is visible as a red run rather than as
  #                      a quietly dead service.
  deploy:
    name: Deploy main
    needs: [tests, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the host deploy
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
          DEPLOY_HEALTH_URL: ${{ secrets.DEPLOY_HEALTH_URL }}
        run: |
          set -euo pipefail

          # `${VAR:-}` throughout: this job must SKIP cleanly when the secrets
          # are absent, not die on `set -u` — an unconfigured deploy must not
          # turn main red.
          if [ -z "${DEPLOY_HOOK_URL:-}" ]; then
            {
              echo "### Nothing is wired up to deploy to yet"
              echo
              echo "Tests and the image smoke-test passed, so main is releasable."
              echo "Add a repository secret \`DEPLOY_HOOK_URL\` (the deploy hook of"
              echo "whichever host you pick) and this job will call it on every"
              echo "push to main. Add \`DEPLOY_HEALTH_URL\` as well and it will also"
              echo "verify the service came back before going green."
            } >> "${GITHUB_STEP_SUMMARY:-/dev/stdout}"
            echo "DEPLOY_HOOK_URL is not set; skipping. main is still releasable."
            exit 0
          fi

          # One POST, deliberately, and no --retry: retrying a hook that
          # starts a release can trigger a SECOND build when the first
          # response is merely lost. A failure here shows as a red run on
          # main, which is the correct signal and is cheap to re-run.
          echo "Triggering deploy..."
          curl --silent --show-error --fail --output /dev/null \
            --max-time 60 -X POST "${DEPLOY_HOOK_URL:-}"
          echo "Deploy triggered."

          if [ -z "${DEPLOY_HEALTH_URL:-}" ]; then
            echo "DEPLOY_HEALTH_URL is not set; not verifying the release."
            exit 0
          fi

          # Hosts build asynchronously, so poll rather than assume.
          echo "Waiting for ${DEPLOY_HEALTH_URL} to answer 200..."
          for attempt in $(seq 1 30); do
            code=$(curl --silent --output /dev/null --write-out '%{http_code}' \
                     --max-time 5 "${DEPLOY_HEALTH_URL:-}" || true)
            if [ "$code" = "200" ]; then
              echo "Service is healthy after ${attempt} attempt(s)."
              exit 0
            fi
            echo "  attempt ${attempt}: HTTP ${code}"
            sleep 10
          done

          echo "::error::the deployed service never answered 200 at ${DEPLOY_HEALTH_URL}"
          exit 1
