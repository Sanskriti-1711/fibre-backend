# ─────────────────────────────────────────────────────────────────────────
# fibre-backend — stack monitor
#
# Runs tools/check_stack.py on a schedule and opens/updates a GitHub issue
# when anything FAILs, closing it again on recovery.
#
# Why this exists: on 2026-10-06 the frontend and the backend were both
# healthy while every browser call failed, because the backend's CORS
# allowlist did not contain the frontend's origin.  Component liveness
# checks all passed.  The CORS preflight check in check_stack.py is the
# one that fails in that situation, so an outage like that becomes an
# issue within 15 minutes instead of a user report.
#
# No third-party monitoring account is needed: failures surface as a
# GitHub issue and as a failed scheduled run (which emails the actor).
#
# ⚠️ Scheduled workflows only run from the DEFAULT branch, and GitHub
#    disables them after 60 days of repository inactivity — re-enable from
#    the Actions tab if the monitor goes quiet.
# ─────────────────────────────────────────────────────────────────────────

name: Stack monitor

on:
  schedule:
    # Every 15 minutes.  GitHub's shortest supported interval is 5, and
    # scheduled runs are best-effort (they can be delayed under load).
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: stack-monitor
  cancel-in-progress: false

jobs:
  probe:
    name: Probe live stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Probe the live stack
        id: probe
        continue-on-error: true
        # stdlib-only, so there is nothing to install.
        #
        # `set -o pipefail` is load-bearing, not decoration. Without it a
        # pipeline's exit status is the LAST command's — `tee`, which is
        # always 0 — so this step reports success no matter what the check
        # found. The alert step then never runs and the monitor is silently
        # decorative. Observed on a real dispatch before this fix:
        # report.txt said "1 FAILED" while the step concluded success.
        run: |
          set -o pipefail
          python3 tools/check_stack.py | tee report.txt

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stack-report
          path: report.txt
          retention-days: 7

      - name: Open or update the alert issue
        if: steps.probe.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          gh label create stack-monitor \
            --color B60205 --description "Automated stack check failure" --force || true

          # Fingerprint just the FAIL/WARN lines, so a repeat of the SAME
          # failure does not add another comment. Without this the monitor
          # comments on every run for as long as an outage lasts — at a
          # 15-minute schedule that is ~96 comments a day on one issue, which
          # trains everyone to ignore it. A *changed* failure still comments,
          # because the fingerprint changes with it.
          fp=$( (grep -E '^(FAIL|WARN)' report.txt || echo 'no-fail-lines') \
                | sha256sum | cut -c1-12 )
          marker="<!-- stack-monitor-fp:${fp} -->"

          num=$(gh issue list --label stack-monitor --state open \
                  --limit 1 --json number --jq '.[0].number // empty')

          if [ -z "$num" ]; then
            { echo "$marker"; echo; cat report.txt; } > payload.md
            gh issue create --title "Stack check failing" \
              --label stack-monitor --body-file payload.md
            echo "opened an issue for fingerprint ${fp}"
            exit 0
          fi

          if gh issue view "$num" --json comments \
               --jq '.comments[].body' | grep -qF "$marker"; then
            echo "fingerprint ${fp} already reported on #${num}; not commenting again"
            exit 0
          fi

          { echo "$marker"; echo; cat report.txt; } > payload.md
          gh issue comment "$num" --body-file payload.md
          echo "reported fingerprint ${fp} on #${num}"

      - name: Close the alert issue on recovery
        if: steps.probe.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          num=$(gh issue list --label stack-monitor --state open \
                  --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$num" ]; then
            gh issue comment "$num" --body "Recovered — all checks pass again."
            gh issue close "$num"
          fi

      # Make the run itself fail, so a red X appears in the Actions tab
      # and GitHub notifies whoever the scheduled workflow is attributed to.
      - name: Fail the run when a check failed
        if: steps.probe.outcome == 'failure'
        run: |
          echo "::error::stack check failed — see the job summary and report.txt"
          exit 1
