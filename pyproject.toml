[project]
name = "fibre-backend"
version = "1.0.0"
description = "FTTH Planning Backend API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Django>=5.1,<6.0",
    "djangorestframework",
    "djangorestframework-simplejwt",
    "django-cors-headers",
    "gunicorn",
    "whitenoise",
    "psycopg2-binary>=2.9.10",
    "requests",
    "pillow",
    "pyproj>=3.6",
]

[project.optional-dependencies]
dev = [
    "ruff==0.6.5",
    "mypy==1.11.2",
    "types-requests==2.32.0.20241016",
    "django-stubs==5.0.0",
    "djangorestframework-stubs==3.15.0",
    "pre-commit==3.8.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "DTZ", # flake8-datetimez
    "T10", # flake8-debugger
    "TCH", # flake8-type-checking
    "PTH", # flake8-use-pathlib
    "SIM", # flake8-simplify
    "ARG", # flake8-unused-arguments
    "ERA", # eradicate
    "TRY", # tryceratops
    "RET", # flake8-return
    "SLF", # self (self-prefers)
]
ignore = [
    "E501",  # line too long (handled by Ruff formatter)
    "B008",  # function calls in default argument
    "C901",  # too complex (mccabe)
    "N802",  # function name should be lowercase (Django view names)
    "N803",  # argument name should be lowercase (Django conventions)
    "N806",  # variable in function should be lowercase (Django conventions)
    "TCH001", # type-checking imports (Django models)
    "TCH002", # type-checking imports (Django models)
    "TCH003", # type-checking imports (Django models)
    "ARG001", # unused method argument (Django view signatures)
    "ARG002", # unused method argument (Django view signatures)
    "SIM102", # nested if (explicit is fine)
    "SIM103", # return bool (explicit is fine)
]
[tool.ruff.lint.per-file-ignores]
"migrations/*.py" = ["I001", "E501"]
"config/settings.py" = ["S101", "S105", "S106"]
"manage.py" = ["S101"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.ruff.lint.isort]
known-first-party = ["config", "projects", "survey", "permits", "users", "ftth_hld", "ftth_lld", "assignments", "testutils", "tools"]
known-third-party = ["django", "rest_framework", "rest_framework_simplejwt", "corsheaders", "gunicorn", "whitenoise", "psycopg2", "requests", "PIL", "pyproj"]

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | _build
  | buck-out
  | build
  | dist
  | migrations
)/
'''

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_optional = true
show_error_codes = true
pretty = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "."
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "config.settings"
strict_settings = true

[[tool.mypy.overrides]]
module = [
    "django.*",
    "rest_framework.*",
    "corsheaders.*",
    "PIL.*",
    "pyproj.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "config.*",
    "projects.*",
    "survey.*",
    "permits.*",
    "users.*",
    "ftth_hld.*",
    "ftth_lld.*",
    "assignments.*",
    "testutils.*",
    "tools.*",
]
ignore_missing_imports = false
follow_imports = "normal"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["config", "projects", "survey", "permits", "users", "ftth_hld", "ftth_lld", "assignments"]
omit = ["*/migrations/*", "*/tests/*", "manage.py", "config/settings.py"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.pre-commit]
fail_fast = false